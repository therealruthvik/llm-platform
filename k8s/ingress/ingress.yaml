apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llm-ingress
  namespace: llm-platform
  annotations:
    # NO rewrite-target – pass paths through as-is to backends
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"   # allow large JSONL uploads
spec:
  ingressClassName: nginx
  rules:
    - host: llm.local
      http:
        paths:
          # ── Backend API routes (must come before / catch-all) ──────────────
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: llm-backend
                port:
                  number: 80
          - path: /chat
            pathType: Prefix
            backend:
              service:
                name: llm-backend
                port:
                  number: 80
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: llm-backend
                port:
                  number: 80
          - path: /version
            pathType: Prefix
            backend:
              service:
                name: llm-backend
                port:
                  number: 80
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: llm-backend
                port:
                  number: 80
          # ── Frontend catch-all ─────────────────────────────────────────────
          - path: /
            pathType: Prefix
            backend:
              service:
                name: llm-frontend
                port:
                  number: 80
