apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: llm-platform
data:
  # ── UPDATE THESE VALUES to trigger model update pipeline ──────────────────
  # DevOps engineer changes MODEL_NAME + MODEL_VERSION, commits, ArgoCD syncs.
  MODEL_NAME: "microsoft/DialoGPT-medium"
  MODEL_VERSION: "v1"
  MAX_NEW_TOKENS: "200"
  MAX_HISTORY_TURNS: "5"
