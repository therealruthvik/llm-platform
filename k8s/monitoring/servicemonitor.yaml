apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: llm-backend-monitor
  namespace: llm-platform
  labels:
    release: prometheus       # must match kube-prometheus-stack release name
spec:
  selector:
    matchLabels:
      app: llm-backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
