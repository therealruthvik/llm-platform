apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-frontend
  namespace: llm-platform
  labels:
    app: llm-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: llm-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/therealruthvik/llm-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
