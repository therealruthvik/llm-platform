name: Model Update Pipeline (Manual)

# ── Purpose ────────────────────────────────────────────────────────────────────
# Training now happens via Modal GPU (triggered from the WebUI).
# This workflow handles ONLY the post-training steps:
#   1. Verify model exists on HuggingFace Hub
#   2. Update k8s/backend/configmap.yaml with new model info
#   3. ArgoCD detects git change → rolling update in cluster
#   4. Verify new model is serving
#
# When to trigger:
#   - Automatically: after Modal training completes (backend patches K8s directly)
#   - Manually: if you need to switch to any existing HF model without retraining
# ──────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      model_repo:
        description: "HuggingFace model repo (e.g. yourname/llama-v2)"
        required: true
      version_tag:
        description: "Version label (e.g. v2)"
        required: true
        default: "v2"

jobs:

  # ── 1. Validate model exists on HF Hub ────────────────────────────────────
  validate-model:
    name: Validate HuggingFace Model
    runs-on: ubuntu-latest
    steps:
      - name: Check version tag format
        run: |
          VERSION="${{ github.event.inputs.version_tag }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+$ ]]; then
            echo "ERROR: version_tag must match v<number> (e.g. v2). Got: $VERSION"
            exit 1
          fi
          echo "Version tag valid: $VERSION ✓"

      - name: Verify model exists on HuggingFace Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          MODEL="${{ github.event.inputs.model_repo }}"
          echo "Checking https://huggingface.co/$MODEL …"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $HF_TOKEN" \
            "https://huggingface.co/api/models/$MODEL")

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: Model $MODEL not found on HuggingFace (HTTP $HTTP_STATUS)"
            echo "Train the model first via the WebUI Training tab."
            exit 1
          fi
          echo "Model found on HuggingFace ✓"

  # ── 2. Update K8s ConfigMap in git → ArgoCD rolling update ──────────────
  update-k8s-config:
    name: Update K8s ConfigMap
    runs-on: ubuntu-latest
    needs: validate-model
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch configmap.yaml
        run: |
          MODEL="${{ github.event.inputs.model_repo }}"
          VERSION="${{ github.event.inputs.version_tag }}"

          sed -i "s|MODEL_NAME:.*|MODEL_NAME: \"${MODEL}\"|g" \
            k8s/backend/configmap.yaml
          sed -i "s|MODEL_VERSION:.*|MODEL_VERSION: \"${VERSION}\"|g" \
            k8s/backend/configmap.yaml

          echo "Updated configmap:"
          grep -E "MODEL_NAME|MODEL_VERSION" k8s/backend/configmap.yaml

      - name: Commit and push
        run: |
          git config user.name  "model-update-bot"
          git config user.email "model-update-bot@users.noreply.github.com"
          git add k8s/backend/configmap.yaml
          git diff --staged --quiet && echo "No changes needed" && exit 0
          git commit -m "model: upgrade to ${{ github.event.inputs.model_repo }} (${{ github.event.inputs.version_tag }})"
          git push

  # ── 3. Verify model is live in cluster ────────────────────────────────────
  verify:
    name: Verify Model Update
    runs-on: ubuntu-latest
    needs: update-k8s-config
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - name: Configure kubectl
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config

      - name: Wait for ArgoCD sync + rollout (90s)
        run: sleep 90

      - name: Wait for deployment rollout
        run: kubectl rollout status deployment/llm-backend -n llm-platform --timeout=300s

      - name: Verify /version endpoint
        run: |
          EXPECTED_VERSION="${{ github.event.inputs.version_tag }}"
          EXPECTED_MODEL="${{ github.event.inputs.model_repo }}"

          kubectl port-forward svc/llm-backend 8080:80 -n llm-platform &
          sleep 5

          RESP=$(curl -sf http://localhost:8080/version)
          echo "Response: $RESP"

          ACTUAL_VERSION=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['model_version'])")
          ACTUAL_MODEL=$(echo "$RESP"   | python3 -c "import sys,json; print(json.load(sys.stdin)['model_name'])")

          kill %1 2>/dev/null || true

          [ "$ACTUAL_VERSION" = "$EXPECTED_VERSION" ] || { echo "FAIL: version $ACTUAL_VERSION != $EXPECTED_VERSION"; exit 1; }
          [ "$ACTUAL_MODEL"   = "$EXPECTED_MODEL"   ] || { echo "FAIL: model $ACTUAL_MODEL != $EXPECTED_MODEL"; exit 1; }

          echo "✓ Model update verified: $ACTUAL_MODEL ($ACTUAL_VERSION)"
