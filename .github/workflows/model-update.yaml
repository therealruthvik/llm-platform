name: Model Update Pipeline (Manual)

# ── Triggered manually by DevOps engineer ─────────────────────────────────
# Flow:
#   1. DevOps uploads data (python training/upload_data.py)
#   2. DevOps triggers THIS workflow from GitHub Actions UI
#   3. Workflow trains model, pushes to HuggingFace
#   4. Workflow updates k8s/backend/configmap.yaml with new model info
#   5. ArgoCD detects git change → rolling update in cluster
#   6. Verify step confirms new model is serving

on:
  workflow_dispatch:
    inputs:
      base_model:
        description: "Base HuggingFace model to fine-tune"
        required: true
        default: "microsoft/DialoGPT-medium"
      dataset_repo:
        description: "HF dataset repo (user/dataset-name)"
        required: true
      new_model_repo:
        description: "HF model repo to push to (user/model-name)"
        required: true
      new_version_tag:
        description: "Version label (e.g. v2)"
        required: true
        default: "v2"
      epochs:
        description: "Training epochs"
        required: false
        default: "3"

jobs:

  # ── GATE: confirm inputs before expensive training ─────────────────────────
  validate-inputs:
    name: Validate Inputs
    runs-on: ubuntu-latest
    steps:
      - name: Check HF token secret exists
        run: |
          if [ -z "${{ secrets.HF_TOKEN }}" ]; then
            echo "ERROR: HF_TOKEN secret is not set in this repository."
            exit 1
          fi
          echo "HF_TOKEN present ✓"

      - name: Validate version tag format
        run: |
          VERSION="${{ github.event.inputs.new_version_tag }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+$ ]]; then
            echo "ERROR: version_tag must match pattern v<number> (e.g. v2, v3). Got: $VERSION"
            exit 1
          fi
          echo "Version tag $VERSION is valid ✓"

  # ── 1. Download dataset from HuggingFace ──────────────────────────────────
  download-data:
    name: Download Training Data
    runs-on: ubuntu-latest
    needs: validate-inputs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface-hub
        run: pip install huggingface-hub datasets --quiet

      - name: Download dataset from HF Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import hf_hub_download
          token = os.environ["HF_TOKEN"]
          path = hf_hub_download(
              repo_id="${{ github.event.inputs.dataset_repo }}",
              filename="conversations.jsonl",
              repo_type="dataset",
              token=token,
              local_dir="./training/data",
          )
          print(f"Downloaded to: {path}")
          EOF

      - name: Validate data format
        run: |
          python - <<'EOF'
          import json, sys
          errors = []
          with open("training/data/conversations.jsonl") as f:
              for i, line in enumerate(f, 1):
                  try:
                      obj = json.loads(line)
                      assert "conversations" in obj, "missing 'conversations' key"
                      for turn in obj["conversations"]:
                          assert "role" in turn and "content" in turn
                  except Exception as e:
                      errors.append(f"Line {i}: {e}")
          if errors:
              print("Data validation FAILED:")
              for e in errors: print(f"  {e}")
              sys.exit(1)
          print("Data validation passed ✓")
          EOF

      - name: Upload data artifact
        uses: actions/upload-artifact@v4
        with:
          name: training-data
          path: training/data/conversations.jsonl

  # ── 2. Train model ─────────────────────────────────────────────────────────
  train:
    name: Train Model
    runs-on: ubuntu-latest      # swap to GPU runner if available
    needs: download-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install training dependencies
        run: pip install -r training/requirements.txt --quiet

      - name: Download training data artifact
        uses: actions/download-artifact@v4
        with:
          name: training-data
          path: training/data

      - name: Run training
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python training/train.py \
            --base_model "${{ github.event.inputs.base_model }}" \
            --data_path  training/data/conversations.jsonl \
            --output_dir training/output \
            --epochs     ${{ github.event.inputs.epochs }} \
            --batch_size 2

      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: training/output
          retention-days: 7

  # ── 3. Evaluate model ──────────────────────────────────────────────────────
  evaluate:
    name: Evaluate Model
    runs-on: ubuntu-latest
    needs: train
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install transformers torch evaluate --quiet

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: training/output

      - name: Smoke-test inference
        run: |
          python - <<'EOF'
          import torch
          from transformers import AutoModelForCausalLM, AutoTokenizer

          model_dir = "training/output"
          tokenizer = AutoTokenizer.from_pretrained(model_dir)
          model = AutoModelForCausalLM.from_pretrained(model_dir)
          model.eval()

          prompt = "Hello!" + tokenizer.eos_token
          ids = tokenizer.encode(prompt, return_tensors="pt")
          with torch.no_grad():
              out = model.generate(ids, max_new_tokens=50, pad_token_id=tokenizer.eos_token_id)
          reply = tokenizer.decode(out[0][ids.shape[-1]:], skip_special_tokens=True)
          print(f"Smoke test reply: {reply}")
          assert len(reply.strip()) > 0, "Model produced empty reply – failing evaluation"
          print("Evaluation passed ✓")
          EOF

  # ── 4. Push model to HuggingFace Hub ──────────────────────────────────────
  push-to-hub:
    name: Push Model to HuggingFace
    runs-on: ubuntu-latest
    needs: evaluate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install transformers huggingface-hub --quiet

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: training/output

      - name: Push to HuggingFace Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python training/push_to_hub.py \
            --model_dir    training/output \
            --repo_id      "${{ github.event.inputs.new_model_repo }}" \
            --version_tag  "${{ github.event.inputs.new_version_tag }}" \
            --hf_token     "$HF_TOKEN"

  # ── 5. Update K8s ConfigMap → triggers ArgoCD rolling update ──────────────
  update-k8s-config:
    name: Update K8s ConfigMap
    runs-on: ubuntu-latest
    needs: push-to-hub
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch configmap.yaml with new model
        run: |
          MODEL_NAME="${{ github.event.inputs.new_model_repo }}"
          MODEL_VERSION="${{ github.event.inputs.new_version_tag }}"

          # Update MODEL_NAME
          sed -i "s|MODEL_NAME:.*|MODEL_NAME: \"${MODEL_NAME}\"|g" \
            k8s/backend/configmap.yaml

          # Update MODEL_VERSION
          sed -i "s|MODEL_VERSION:.*|MODEL_VERSION: \"${MODEL_VERSION}\"|g" \
            k8s/backend/configmap.yaml

          echo "Updated configmap:"
          grep -E "MODEL_NAME|MODEL_VERSION" k8s/backend/configmap.yaml

      - name: Commit and push
        run: |
          git config user.name  "model-update-bot"
          git config user.email "model-update-bot@users.noreply.github.com"
          git add k8s/backend/configmap.yaml
          git commit -m "model: upgrade to ${{ github.event.inputs.new_model_repo }} (${{ github.event.inputs.new_version_tag }})"
          git push

  # ── 6. Verify model update in cluster ─────────────────────────────────────
  verify-model-update:
    name: Verify Model Update
    runs-on: ubuntu-latest
    needs: update-k8s-config
    steps:
      - uses: actions/checkout@v4

      - name: Wait for ArgoCD sync + pod rollout
        run: |
          echo "Waiting 90s for ArgoCD to detect git change and trigger rollout …"
          sleep 90

      - name: Install kubectl + argocd CLI
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd && sudo mv argocd /usr/local/bin/

      - name: Configure kubectl
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config

      - name: Wait for deployment rollout
        run: |
          kubectl rollout status deployment/llm-backend -n llm-platform --timeout=300s

      - name: Check /version endpoint returns new model
        run: |
          EXPECTED_VERSION="${{ github.event.inputs.new_version_tag }}"
          EXPECTED_MODEL="${{ github.event.inputs.new_model_repo }}"

          # Port-forward to backend service
          kubectl port-forward svc/llm-backend 8080:80 -n llm-platform &
          PF_PID=$!
          sleep 5

          ACTUAL=$(curl -sf http://localhost:8080/version)
          echo "Response: $ACTUAL"

          ACTUAL_VERSION=$(echo "$ACTUAL" | python3 -c "import sys,json; print(json.load(sys.stdin)['model_version'])")
          ACTUAL_MODEL=$(echo "$ACTUAL"   | python3 -c "import sys,json; print(json.load(sys.stdin)['model_name'])")

          kill $PF_PID 2>/dev/null || true

          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "FAIL: expected version=$EXPECTED_VERSION, got $ACTUAL_VERSION"
            exit 1
          fi
          if [ "$ACTUAL_MODEL" != "$EXPECTED_MODEL" ]; then
            echo "FAIL: expected model=$EXPECTED_MODEL, got $ACTUAL_MODEL"
            exit 1
          fi

          echo "Model update verified ✓  version=$ACTUAL_VERSION  model=$ACTUAL_MODEL"
