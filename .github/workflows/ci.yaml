name: CI – Build, Test, Scan, Push

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/llm-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/llm-frontend

jobs:

  # ── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: pip install flake8 black isort bandit --quiet

      - name: flake8 (style)
        run: flake8 app/backend training --max-line-length=100 --ignore=E501,W503,E203

      - name: black (formatting)
        run: black --check app/backend training

      - name: isort (import order)
        run: isort --check-only --profile black app/backend training

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci --prefix app/frontend

      - name: ESLint (frontend)
        run: npm run lint --prefix app/frontend || true   # warn only on first pass

  # ── 2. Unit Tests ──────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          pip install --upgrade pip
          pip install -r app/backend/requirements-test.txt --quiet

      - name: Run pytest
        run: |
          cd app/backend
          pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/backend/test-results.xml

  # ── 3. Security Scan ──────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bandit (Python SAST)
        run: |
          pip install bandit --quiet
          bandit -r app/backend training -ll -ii --exit-zero

      - name: pip-audit (dependency CVEs)
        run: |
          pip install pip-audit --quiet
          pip-audit -r app/backend/requirements.txt --ignore-vuln PYSEC-2022-42969 || true

      - name: Trivy (filesystem scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "0"          # warn only – image scan (post-push) enforces CRITICAL
          ignore-unfixed: true

  # ── 4. Build & Push Docker Images ─────────────────────────────────────────
  build-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: [test, security]
    permissions:
      contents: read
      packages: write
    outputs:
      backend_tag: ${{ steps.meta-backend.outputs.tags }}
      frontend_tag: ${{ steps.meta-frontend.outputs.tags }}
      sha_short: ${{ steps.sha.outputs.sha_short }}

    steps:
      - uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Backend
      - name: Docker meta – backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./app/backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-backend.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Frontend
      - name: Docker meta – frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./app/frontend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-frontend.outputs.tags }}
          build-args: |
            VITE_API_URL=http://llm.local
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 5. Image Security Scan (post-push) ────────────────────────────────────
  image-scan:
    name: Image Security Scan
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - name: Trivy – scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:latest
          severity: "CRITICAL"
          exit-code: "1"
          ignore-unfixed: true

      - name: Trivy – scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:latest
          severity: "CRITICAL"
          exit-code: "1"
          ignore-unfixed: true

  # ── 6. Update K8s manifests with new image SHA ────────────────────────────
  update-manifests:
    name: Update K8s Image Tags
    runs-on: ubuntu-latest
    needs: [build-push, image-scan]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update backend image tag in deployment.yaml
        run: |
          SHA="${{ needs.build-push.outputs.sha_short }}"
          sed -i "s|image: ghcr.io/${{ github.repository_owner }}/llm-backend:.*|image: ${{ env.BACKEND_IMAGE }}:sha-${SHA}|g" \
            k8s/backend/deployment.yaml
          sed -i "s|image: ghcr.io/${{ github.repository_owner }}/llm-frontend:.*|image: ${{ env.FRONTEND_IMAGE }}:sha-${SHA}|g" \
            k8s/frontend/deployment.yaml

      - name: Commit and push manifest update
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/backend/deployment.yaml k8s/frontend/deployment.yaml
          git diff --staged --quiet || git commit -m "ci: update image tags to sha-${{ needs.build-push.outputs.sha_short }} [skip ci]"
          git push
